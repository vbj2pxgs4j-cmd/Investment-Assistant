name: Daily Ingestion & ChromaDB Indexing Scheduler

on:
  schedule:
    # Runs everyday at 10:00 AM IST (04:30 AM UTC)
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  daily-ingestion-and-reindex:
    name: Crawl, Normalize, Chunk, Embed & Update Vector Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache HuggingFace Transformers & Sentence-Transformers Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-${{ hashFiles('backend/app/rag/vector_store.py') }}
          restore-keys: |
            ${{ runner.os }}-huggingface-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Ingestion Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m backend.app.rag.daily_ingestion --verify --force

      - name: Run Integrity & Retrieval Smoke Tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest backend/tests/test_factual_accuracy.py backend/tests/test_api_endpoints.py -v

      - name: Commit and Push Updated Knowledge Base
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/processed/ data/vector_store/
          if git diff --staged --quiet; then
            echo "No data changes detected. Vector store is already up to date."
          else
            CURRENT_DATE=$(date -u +'%Y-%m-%d')
            git commit -m "chore(data): daily automated scheme ingestion and ChromaDB re-index ($CURRENT_DATE) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
